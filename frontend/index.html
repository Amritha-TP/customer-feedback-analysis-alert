<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Feedback Analyzer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;

            min-height: 180px;

            padding: 15px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 10px;

            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #result {
            display: none;

            margin-top: 25px;

            padding: 20px;

            border-radius: 12px;

            text-align: center;
        }

        .positive {
            background: #e8f7ed;
            color: #176b38;
        }

        .neutral {
            background: #fff7df;
            color: #765d00;
        }

        .negative {
            background: #fde8e8;
            color: #a52222;
        }

        .sentiment {
            font-size: 26px;
            font-weight: bold;
        }

        .telegram {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            Customer Feedback Analyzer
        </h1>

        <p class="subtitle">
            Analyze customer feedback using NLP
        </p>


        <textarea
            id="feedback"
            placeholder="Enter customer feedback here..."
        ></textarea>


        <button
            id="analyzeButton"
            onclick="analyzeFeedback()"
        >
            Analyze Feedback
        </button>


        <div id="result">

            <div
                id="sentiment"
                class="sentiment">
            </div>

            <div
                id="telegram"
                class="telegram">
            </div>

        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
